[project]
name = "casegalaxy"
version = "0.1.0"
description = "Agente preditivo de curtidas em YouTube Shorts (Inteli Academy x Galaxies)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# O cache do uv fica no disco Linux e o .venv em /mnt/c (sistemas de arquivos
# diferentes): hardlink é impossível, então a cópia é declarada explicitamente.
link-mode = "copy"
