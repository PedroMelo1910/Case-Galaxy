[project]
name = "casegalaxy"
version = "0.1.0"
description = "Agente preditivo de curtidas em YouTube Shorts (Inteli Academy x Galaxies)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Extração local de legenda e capa (C6, C7): CPU, sem CUDA.
    "easyocr",
    "mediapipe",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "torch",
    "torchvision",
    "transformers",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "langgraph>=1.2.15",
    "mcp>=2.3,<3",
]

# Pontos de entrada para quem só quer testar o software (sem reconstruir o dataset de treino).
[project.scripts]
casegalaxy-mcp = "src.agente.servidor_mcp:main"
casegalaxy-demo = "src.demonstracao:main"
casegalaxy-pacote-servido = "src.agente.manifesto_servido:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# O cache do uv fica no disco Linux e o .venv em /mnt/c (sistemas de arquivos
# diferentes): hardlink é impossível, então a cópia é declarada explicitamente.
link-mode = "copy"

# Torch e torchvision só da distribuição para CPU (sem bibliotecas CUDA de vários GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv.build-backend]
module-name = "src"
module-root = ""
